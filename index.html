<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d4a3c">
  <title>Mahjong Garden</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17362f;background:linear-gradient(145deg,#edf4ef,#cfe0d7)}main{text-align:center;padding:28px}.tile{width:64px;height:80px;margin:0 auto 18px;display:grid;place-items:center;border-radius:10px;background:#fffdf7;box-shadow:0 7px 0 #c9bfae,0 18px 35px rgba(17,58,46,.18);font:800 36px Georgia,serif;animation:pulse 1.2s ease-in-out infinite alternate}p{margin:0;color:#667a73;font-weight:650}@keyframes pulse{to{transform:translateY(-5px)}}
  </style>
</head>
<body>
  <main id="status"><div class="tile">和</div><p>Opening Mahjong Garden…</p></main>
  <script>
    (async function () {
      try {
        const files = ['payload-1.b64', 'payload-2.b64', 'payload-3.b64'];
        const parts = await Promise.all(files.map(async file => {
          const response = await fetch(file, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Could not load ${file}`);
          return response.text();
        }));
        const binary = atob(parts.join('').replace(/\s/g, ''));
        const compressed = Uint8Array.from(binary, character => character.charCodeAt(0));
        if (!('DecompressionStream' in window)) throw new Error('This browser does not support the secure app loader.');
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').innerHTML = '<div class="tile">!</div><p>Mahjong Garden could not open. Refresh the page in a current version of Safari, Chrome, or Edge.</p>';
        console.error(error);
      }
    }());
  </script>
</body>
</html>
